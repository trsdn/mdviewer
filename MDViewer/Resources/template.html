<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{CSP_POLICY}}">
<style nonce="{{CSP_NONCE}}">
:root {
    --color-bg: #ffffff;
    --color-fg: #24292f;
    --color-border: #d0d7de;
    --color-code-bg: #f6f8fa;
    --color-code-fg: #24292f;
    --color-link: #0969da;
    --color-blockquote-fg: #656d76;
    --color-blockquote-border: #d0d7de;
    --color-hr: #d8dee4;
    --color-selection-bg: #b6d7ff;
    --color-selection-fg: #24292f;
    --color-caret: #24292f;
    --color-active-line: #f6f8fa;
    --color-gutter-bg: #ffffff;
    --color-gutter-fg: #656d76;
    --color-splitter: #d0d7de;
    --color-splitter-hover: #0969da;
    --color-search-match: #fff8c5;
    --color-search-match-selected: #b6d7ff;

    --syntax-keyword: #cf222e;
    --syntax-string: #0a3069;
    --syntax-number: #0550ae;
    --syntax-comment: #6e7781;
    --syntax-function: #8250df;
    --syntax-type: #953800;
    --syntax-variable: #24292f;
    --syntax-punctuation: #57606a;
    --alert-note: #0969da;
    --alert-tip: #1a7f37;
    --alert-important: #8250df;
    --alert-warning: #9a6700;
    --alert-caution: #cf222e;

    --mono-font: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

html { background-color: var(--color-bg); }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--color-fg);
    background-color: var(--color-bg);
    margin: 0;
    padding: 32px 48px;
    word-wrap: break-word;
    caret-color: var(--color-caret);
}

::selection {
    color: var(--color-selection-fg);
    background-color: var(--color-selection-bg);
}

:focus-visible {
    outline: 2px solid var(--color-splitter-hover);
    outline-offset: 2px;
}

h1, h2, h3, h4, h5, h6 {
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
    scroll-margin-top: 16px;
}

h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
h3 { font-size: 1.25em; }
h4 { font-size: 1em; }

p { margin-top: 0; margin-bottom: 16px; }
a { color: var(--color-link); text-decoration: none; }
a:hover { text-decoration: underline; }

code {
    font-family: var(--mono-font);
    font-size: 85%;
    background-color: var(--color-code-bg);
    color: var(--color-code-fg);
    padding: 0.2em 0.4em;
    border-radius: 6px;
}

pre {
    background-color: var(--color-code-bg);
    border-radius: 6px;
    padding: 16px;
    overflow: auto;
    line-height: 1.45;
}

pre code { background: none; padding: 0; font-size: 85%; }

blockquote {
    margin: 0 0 16px 0;
    padding: 0 1em;
    color: var(--color-blockquote-fg);
    border-left: 0.25em solid var(--color-blockquote-border);
}

hr {
    height: 0.25em;
    padding: 0;
    margin: 24px 0;
    background-color: var(--color-hr);
    border: 0;
    border-radius: 2px;
}

ul, ol { margin-top: 0; margin-bottom: 16px; padding-left: 2em; }
li + li { margin-top: 0.25em; }

table {
    border-collapse: collapse;
    border-spacing: 0;
    margin-bottom: 16px;
    width: auto;
    overflow: auto;
}

th, td { padding: 6px 13px; border: 1px solid var(--color-border); }
th { font-weight: 600; }
img { max-width: 100%; height: auto; }
input[type="checkbox"] { margin-right: 0.5em; accent-color: var(--color-link); }
mark { color: var(--color-selection-fg); background-color: var(--color-search-match); }

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
}

/* ---------- GitHub alerts (issue #20) ---------- */

.md-alert {
    margin: 0 0 16px 0;
    padding: 8px 16px;
    border-left: 0.25em solid var(--md-alert-color, var(--color-border));
    border-radius: 0 6px 6px 0;
    background-color: var(--color-active-line);
    color: var(--color-fg);
}

.md-alert > :last-child { margin-bottom: 0; }

.md-alert-label {
    display: flex;
    align-items: center;
    gap: 0.5em;
    margin: 0 0 8px 0;
    font-weight: 600;
    color: var(--md-alert-color, var(--color-fg));
}

.md-alert-label svg {
    flex: none;
    width: 1em;
    height: 1em;
    fill: currentColor;
}

.md-alert-note { --md-alert-color: var(--alert-note); }
.md-alert-tip { --md-alert-color: var(--alert-tip); }
.md-alert-important { --md-alert-color: var(--alert-important); }
.md-alert-warning { --md-alert-color: var(--alert-warning); }
.md-alert-caution { --md-alert-color: var(--alert-caution); }

/* ---------- Task lists (issue #20) ---------- */

ul.contains-task-list { list-style: none; padding-left: 1.4em; }
ul.contains-task-list ul.contains-task-list { padding-left: 1.6em; }
li.task-list-item { position: relative; }
li.task-list-item > input[type="checkbox"] {
    margin-left: -1.4em;
    vertical-align: middle;
    opacity: 1;
}

/* ---------- Footnotes (issue #12) ---------- */

.footnotes {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
    font-size: 90%;
    color: var(--color-blockquote-fg);
}

.footnotes ol { padding-left: 1.5em; }
.footnotes li:target { background-color: var(--color-search-match); border-radius: 4px; }
sup a[data-footnote-ref] { padding: 0 0.15em; }
sup a[data-footnote-ref]:target { background-color: var(--color-search-match); border-radius: 4px; }
a[data-footnote-backref] { text-decoration: none; padding: 0 0.25em; }

/* ---------- Code block controls (issue #22) ---------- */

figure.md-code {
    margin: 0 0 16px 0;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    overflow: hidden;
    background-color: var(--color-code-bg);
}

figure.md-code > figcaption {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px 4px 12px;
    border-bottom: 1px solid var(--color-border);
    background-color: var(--color-active-line);
    font-size: 12px;
    line-height: 1.6;
    color: var(--color-gutter-fg);
}

.md-code-language {
    font-family: var(--mono-font);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-right: auto;
}

.md-code-actions { display: flex; gap: 4px; align-items: center; }

.md-code-button {
    font: inherit;
    font-size: 12px;
    color: var(--color-fg);
    background-color: transparent;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    padding: 1px 8px;
    cursor: default;
}

.md-code-button:hover { border-color: var(--color-splitter-hover); }
.md-code-button[aria-pressed="true"] {
    background-color: var(--color-search-match);
    border-color: var(--color-splitter-hover);
}

.md-code-status {
    font-size: 12px;
    min-width: 5.5em;
    text-align: right;
    color: var(--color-gutter-fg);
}

figure.md-code > .md-code-body { display: flex; align-items: stretch; }

.md-code-gutter {
    display: none;
    flex: none;
    padding: 16px 0 16px 12px;
    font-family: var(--mono-font);
    font-size: 85%;
    line-height: 1.45;
    text-align: right;
    color: var(--color-gutter-fg);
    background-color: var(--color-gutter-bg);
    border-right: 1px solid var(--color-border);
    user-select: none;
}

.md-code-gutter > span { display: block; padding-right: 8px; }

figure.md-code[data-lines="on"] .md-code-gutter { display: block; }
figure.md-code > .md-code-body > pre { flex: 1 1 auto; margin: 0; border-radius: 0; border: 0; min-width: 0; }
figure.md-code[data-wrap="on"] > .md-code-body > pre { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- Shared highlighting palette (issues #13 and #17) ---------- */

.token.comment, .token.prolog, .token.cdata, .hljs-comment, .hljs-quote {
    color: var(--syntax-comment);
    font-style: italic;
}
.token.keyword, .token.atrule, .token.important, .token.rule,
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-doctag,
.hljs-meta .hljs-keyword {
    color: var(--syntax-keyword);
}
.token.string, .token.char, .token.attr-value, .token.regex,
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute,
.hljs-meta .hljs-string {
    color: var(--syntax-string);
}
.token.number, .token.boolean, .token.constant, .token.symbol,
.hljs-number, .hljs-literal.hljs-number, .hljs-bullet, .hljs-link {
    color: var(--syntax-number);
}
.token.function, .token.class-name, .token.selector,
.hljs-title, .hljs-title.function_, .hljs-section, .hljs-name,
.hljs-selector-id, .hljs-selector-class {
    color: var(--syntax-function);
}
.token.builtin, .token.tag, .token.attr-name, .token.property,
.hljs-type, .hljs-built_in, .hljs-class .hljs-title, .hljs-tag {
    color: var(--syntax-type);
}
.token.variable, .token.parameter, .hljs-variable, .hljs-template-variable,
.hljs-params, .hljs-attr {
    color: var(--syntax-variable);
}
.token.punctuation, .token.operator, .token.entity, .token.url,
.hljs-punctuation, .hljs-operator, .hljs-subst {
    color: var(--syntax-punctuation);
}
.token.deleted, .hljs-deletion { color: var(--alert-caution); }
.token.inserted { color: var(--alert-tip); }
.token.bold, .hljs-strong { font-weight: 600; }
.token.italic, .hljs-emphasis { font-style: italic; }

/* ---------- Frontmatter metadata card (issue #18, Full only) ---------- */

.md-frontmatter {
    margin: 0 0 24px 0;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background-color: var(--color-active-line);
    font-size: 90%;
}

.md-frontmatter > summary {
    padding: 6px 12px;
    cursor: default;
    font-weight: 600;
    color: var(--color-gutter-fg);
}

.md-frontmatter dl {
    margin: 0;
    padding: 0 12px 10px 12px;
    display: grid;
    grid-template-columns: minmax(6em, max-content) 1fr;
    gap: 2px 12px;
}

.md-frontmatter dt { font-weight: 600; color: var(--color-gutter-fg); }
.md-frontmatter dd { margin: 0; overflow-wrap: anywhere; }
.md-frontmatter .md-frontmatter-error { color: var(--alert-caution); padding: 0 12px 10px; }
.md-frontmatter ul { margin: 0; padding-left: 1.2em; }

/* ---------- Diagrams (issue #16, Full only) ---------- */

.md-diagram {
    margin: 0 0 16px 0;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background-color: var(--color-code-bg);
    overflow: hidden;
}

.md-diagram-toolbar {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 8px;
    border-bottom: 1px solid var(--color-border);
    background-color: var(--color-active-line);
    font-size: 12px;
}

.md-diagram-toolbar .md-diagram-title {
    margin-right: auto;
    color: var(--color-gutter-fg);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.md-diagram-surface {
    position: relative;
    min-height: 60px;
    padding: 8px;
    touch-action: none;
}

.md-diagram-surface svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.md-diagram-pending { padding: 12px; color: var(--color-gutter-fg); font-size: 90%; }

.md-diagram-error {
    margin: 0;
    padding: 8px 12px;
    color: var(--alert-caution);
    font-size: 90%;
    border-top: 1px solid var(--color-border);
}

/* ---------- Image viewer (issue #21) ---------- */

img.md-zoomable { cursor: zoom-in; }

.md-image-viewer {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    background-color: var(--color-bg);
}

.md-image-viewer[hidden] { display: none; }

.md-image-viewer-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--color-border);
    background-color: var(--color-active-line);
    font-size: 12px;
}

.md-image-viewer-caption {
    margin-right: auto;
    color: var(--color-gutter-fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 50%;
}

.md-image-viewer-stage {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    touch-action: none;
    cursor: grab;
}

.md-image-viewer-stage.md-panning { cursor: grabbing; }

.md-image-viewer-stage img {
    position: absolute;
    top: 0;
    left: 0;
    max-width: none;
    transform-origin: 0 0;
    user-select: none;
    -webkit-user-drag: none;
}

@media (max-width: 600px) {
    body { padding: 24px; }
}

@media print {
    body { padding: 0; }
    .md-code-actions,
    .md-code-status,
    .md-diagram-toolbar,
    .md-image-viewer { display: none !important; }
    figure.md-code { break-inside: avoid; border-color: #999999; }
    figure.md-code > .md-code-body > pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    figure.md-code > figcaption { background: none; }
    .md-diagram { break-inside: avoid; border-color: #999999; }
    .md-alert { break-inside: avoid; }
    .footnotes { break-before: auto; }
    a[data-footnote-backref] { display: none; }
    .md-frontmatter > summary { list-style: none; }
}
</style>
</head>
<body>
<main id="content"></main>
<script nonce="{{CSP_NONCE}}">window.__MDVIEWER_CONFIG__ = {{RENDER_CONFIG_JSON}};</script>
<script nonce="{{CSP_NONCE}}">{{MARKED_JS}}</script>
<script nonce="{{CSP_NONCE}}">{{DOMPURIFY_JS}}</script>
<script nonce="{{CSP_NONCE}}">{{MARKED_FOOTNOTE_JS}}</script>
<script nonce="{{CSP_NONCE}}">window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
<script nonce="{{CSP_NONCE}}">{{HIGHLIGHTER_JS}}</script>
<script nonce="{{CSP_NONCE}}">{{RENDERER_JS}}</script>
<script nonce="{{CSP_NONCE}}">{{EDITION_RENDERER_JS}}</script>
</body>
</html>
